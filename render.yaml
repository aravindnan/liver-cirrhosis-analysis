# Render Blueprint for Cirrh0: a demo or private beta, with every plan set to Render's free tier.
# Read DEPLOY.md first: the free tier has limits that matter (the database expires after 30 days).
#
# Two web services and one database, all in one region:
#   cirrh0     the API, which also serves the built web app, so the site and the API share one origin
#   cirrh0-ml  the Python model service (stage estimate, lab extraction, image detection)
#   cirrh0-db  PostgreSQL
#
# Variables marked `sync: false` are asked for once, when the Blueprint is first created.

databases:
  - name: cirrh0-db
    databaseName: cirrh0
    user: cirrh0
    region: singapore
    plan: free # EXPIRES 30 DAYS AFTER CREATION and has no backups. See DEPLOY.md before any real use.
    postgresMajorVersion: "16"

services:
  - type: web
    name: cirrh0-ml
    runtime: python
    region: singapore
    plan: free
    rootDir: cirrh0-prediction-model
    buildCommand: pip install -r requirements.txt
    # One worker keeps memory low; threads let it wait on the Gemini and Roboflow calls in parallel.
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.10
      # Shared secret. The API reads the same value (see ML_SERVICE_TOKEN on cirrh0 below).
      - key: ML_SERVICE_TOKEN
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: ROBOFLOW_API_KEY
        sync: false
      - key: UPLOAD_HOSTS
        value: res.cloudinary.com

  - type: web
    name: cirrh0
    runtime: node
    region: singapore
    plan: free
    # Build the web app, then install the API (its postinstall generates the Prisma client).
    # --include=dev because the web build needs its devDependencies (Vite) even when NODE_ENV=production.
    # The web build needs about 350 MB, which fits Render's 512 MB free build limit. (Create React App
    # needed 1.6 to 2 GB and was killed; see DEPLOY.md.)
    buildCommand: npm --prefix cirrh0 ci --include=dev && npm --prefix cirrh0 run build && npm --prefix cirrh0-backend ci
    # Apply database migrations, then start. (preDeployCommand would be cleaner but is paid-only.)
    startCommand: cd cirrh0-backend && npm run db:migrate && npm run serve
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      # Keeps Node's garbage collector tight so the build stays well inside 512 MB.
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      # --- API ---
      - key: DATABASE_URL
        fromDatabase:
          name: cirrh0-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: API_BASE_PATH
        value: /api
      - key: WEB_DIR
        value: ../cirrh0/build
      - key: UPLOAD_HOSTS
        value: res.cloudinary.com
      # Free web services cannot receive private-network traffic, so the API reaches the model service by
      # its public address. Enter https://cirrh0-ml.onrender.com, or whatever address Render shows for
      # the cirrh0-ml service if that name was already taken.
      - key: ML_SERVICE_URL
        sync: false
      - key: ML_SERVICE_TOKEN
        fromService:
          type: web
          name: cirrh0-ml
          envVarKey: ML_SERVICE_TOKEN
      # --- Web app (read while it is built; changing one needs a new deploy, not just a restart) ---
      - key: VITE_API_URL
        value: /api
      - key: VITE_DEMO_NOTICE
        value: "true"
      - key: VITE_CLOUDINARY_CLOUDNAME
        sync: false
